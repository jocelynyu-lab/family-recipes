<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我們家的食譜</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1 class="title">我們家的食譜</h1>
      <p class="lede">挑一道想吃的菜，吃完記得幫它打分數！</p>
      <section class="who" aria-labelledby="who-h">
        <h2 id="who-h" class="who-h">現在是誰在看？</h2>
        <div class="who-list" id="who-list"></div>
      </section>
    </div>
  </header>

  <main class="wrap">
    <div class="tools">
      <label class="search">
        <span class="sr">搜尋食譜</span>
        <input id="q" type="search" placeholder="找找看：蛋、麵、湯…" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="group" aria-label="分類"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>找不到這道菜。換個字試試看，或請大人把它加進食譜裡。</p>
    <p class="sync" id="sync"></p>
  </main>

  <dialog id="detail" aria-labelledby="d-title">
    <div id="detail-body"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="recipes.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
