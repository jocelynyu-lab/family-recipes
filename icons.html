<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圖示清單｜我們家的食譜</title>
  <style>
    :root { --navy: #13305f; --ink: #1f2633; --muted: #697284; --line: #e3e6ec; --soft: #f4f5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--ink); background: #fff; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { margin: 0; color: var(--navy); font-size: 1.8rem; }
    p.lede { color: var(--muted); margin: 6px 0 20px; }
    input { width: min(360px, 100%); height: 44px; padding: 0 14px; font: inherit; border: 1px solid var(--line); border-radius: 4px; }
    h2 { margin: 32px 0 12px; font-size: 1.1rem; color: var(--navy); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    button.ic { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font: inherit; color: var(--ink); }
    button.ic:hover { border-color: var(--navy); color: var(--navy); }
    button.ic svg { width: 32px; height: 32px; }
    button.ic span { font-size: 0.75rem; color: var(--muted); word-break: break-all; text-align: center; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 4px; background: var(--navy); color: #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    a { color: var(--navy); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>圖示清單</h1>
    <p class="lede">點一下圖示就會複製它的名字，貼到 recipes.js 的 <code>icon: "..."</code> 裡。<a href="./">回食譜</a></p>
    <label><span hidden>搜尋圖示</span><input id="q" type="search" placeholder="搜尋英文名字，例如 cat、soup"></label>
    <div id="list"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="icons.js"></script>
  <script>
    (function () {
      // 依 icons.js 裡的分類註解分組
      const src = document.querySelector('script[src="icons.js"]');
      const names = Object.keys(ICONS);
      const svg = (n) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
      let groups = [{ title: "全部圖示", names }];
      fetch("icons.js").then((r) => r.text()).then((t) => {
        const g = []; let cur = null;
        t.split("\n").forEach((line) => {
          const h = line.match(/\/\/ =====\s*(.+?)\s*=====/);
          if (h) { cur = { title: h[1], names: [] }; g.push(cur); return; }
          const m = line.match(/^\s*"([a-z0-9-]+)":/);
          if (m && cur) cur.names.push(m[1]);
        });
        if (g.length) { groups = g; render(); }
      }).catch(() => {});
      function render() {
        const q = document.getElementById("q").value.trim().toLowerCase();
        document.getElementById("list").innerHTML = groups.map((g) => {
          const list = g.names.filter((n) => !q || n.includes(q));
          if (!list.length) return "";
          return "<h2>" + g.title + "</h2><div class=\"grid\">" +
            list.map((n) => '<button class="ic" type="button" data-name="' + n + '">' + svg(n) + "<span>" + n + "</span></button>").join("") +
            "</div>";
        }).join("") || "<p class=\"lede\">找不到符合的圖示。</p>";
      }
      document.getElementById("q").addEventListener("input", render);
      document.getElementById("list").addEventListener("click", (e) => {
        const b = e.target.closest("[data-name]");
        if (!b) return;
        const n = b.dataset.name;
        const done = () => { const t = document.getElementById("toast"); t.textContent = "已複製：" + n; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); };
        if (navigator.clipboard) navigator.clipboard.writeText(n).then(done, () => { prompt("複製這個名字：", n); });
        else prompt("複製這個名字：", n);
      });
      render();
    })();
  </script>
</body>
</html>
